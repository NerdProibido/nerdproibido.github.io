name: Premium product cards
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/premium-cards.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade product cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=".product{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;display:flex;flex-direction:column}.cover{height:300px;background:#17191f;position:relative;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.num,.new{position:absolute;top:12px;font-size:10px;font-weight:900;padding:6px 9px;border-radius:7px;z-index:3}.num{left:12px;background:var(--r)}.new{right:12px;background:#fff;color:#111}.body{padding:16px;display:flex;flex-direction:column;flex:1}.body h3{font-size:16px;line-height:1.35;margin:8px 0}.body p{font-size:13px;color:var(--muted);line-height:1.5}.amazon{text-align:center;color:#858994;font-size:11px;margin-top:9px}"
          new=".product{background:linear-gradient(180deg,#15171d,#0e1014);border:1px solid #2b2f38;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 10px 30px #0004;transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease}.product:hover{transform:translateY(-7px);border-color:#e5091470;box-shadow:0 20px 45px #0009,0 0 0 1px #e5091425}.cover{height:320px;background:#17191f;position:relative;overflow:hidden}.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 68%,#0e1014 100%);pointer-events:none}.cover img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease,filter .4s ease}.product:hover .cover img{transform:scale(1.045);filter:brightness(1.06)}.num,.new{position:absolute;top:12px;font-size:10px;font-weight:1000;padding:7px 10px;border-radius:999px;z-index:3;letter-spacing:.5px;box-shadow:0 5px 18px #0008}.num{left:12px;background:#0b0c0ee6;border:1px solid #ffffff28;color:#fff}.new{right:12px;background:var(--r);color:#fff}.body{padding:17px;display:flex;flex-direction:column;flex:1}.body small{font-size:10px;letter-spacing:1.4px}.body h3{font-size:16px;line-height:1.35;margin:9px 0 8px;min-height:44px}.body p{font-size:12px;color:#989ca6;line-height:1.5;margin:0 0 15px}.buy{width:100%;letter-spacing:.4px;transition:transform .2s ease,background .2s ease,box-shadow .2s ease;box-shadow:0 8px 22px #e5091425}.buy:hover{transform:translateY(-2px);box-shadow:0 12px 28px #e5091440}.amazon{text-align:center;color:#6f737d;font-size:10px;margin-top:10px;letter-spacing:.4px}"
          if old not in s:
              raise SystemExit('Card CSS block not found; no changes made')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "NerdProibido Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Melhora visual premium dos cards de produtos" || exit 0
          git push
